packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true

engineStrict: true
nodeVersion: 24.15.0
savePrefix: ""

overrides:
  # C76: Next lint uses only globSync(pattern, { onlyDirectories: true }); avoid braces GHSA-vfj7-8cjw-p6xm.
  "@next/eslint-plugin-next@16.3.8>fast-glob": "npm:tinyglobby@0.2.15"
  "brace-expansion@<1.1.20": 1.1.21
  "brace-expansion@>=4.0.0 <5.0.11": 5.0.12
  js-yaml: 4.3.2
  "nanoid@<3.3.18": 3.3.18
  postcss: 8.5.25
  # C91: approved fixes for GHSA-wq5f-xc86-pv6w and GHSA-68fv-2mgg-jv7q.
  sharp: 0.35.5
  source-map-js: 1.2.2

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8

patchedDependencies:
  '@next/eslint-plugin-next@16.3.8': patches/@next__eslint-plugin-next@16.3.8.patch
