name: Unsafe fixture
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: unsafe
  cancel-in-progress: true
env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0
  SUPABASE_VERSION: 2.109.0
  PLAYWRIGHT_VERSION: 1.62.1
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - continue-on-error: true
        env:
          PRODUCTION_SECRET: intentionally-unsafe-fixture
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm audit --audit-level high
          supabase db reset
          supabase db lint --level warning
          supabase test db
          pnpm test:auth
          pnpm test:e2e
      - run: >-
          docker run ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --exit-code 1
  gate:
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0
